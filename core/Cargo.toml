[package]
name = "ofc-core"
version = "1.0.0"
edition = "2021"
description = "OpenFusionCAD streaming engine: Linux-native reimplementation of the Autodesk Fusion streamer"
license = "MIT"

[lib]
name = "ofc_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ofc-streamer"
path = "src/bin/ofc-streamer.rs"

[dependencies]
ureq = { version = "2", features = ["native-certs", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
xz2 = { version = "0.1", features = ["static"] }
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ico = "0.3"
log = "0.4"

[package]
name = "ofc-kernel"
version = "0.1.0"
edition = "2021"
description = "OpenFusionCAD geometry kernel (OpenCASCADE via opencascade-rs) with C ABI for the C# GUI"
license = "LGPL-2.1-only"

[lib]
name = "ofc_kernel"
crate-type = ["rlib"]

[dependencies]
opencascade = "0.3"
glam = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
